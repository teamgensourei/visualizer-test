<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>白玉の分裂</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--fg:#f2f2f2;--dim:#8a8a8a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:#09090b;color:var(--fg);overflow:hidden;font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%}
#ui{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;text-align:center;transition:opacity .8s;pointer-events:none}
#ui.hide{opacity:0}
#ui p{margin:0;color:var(--dim);font-size:13px;letter-spacing:.08em}
#ui .t{position:absolute;bottom:18%}
button,label.btn{pointer-events:auto;cursor:pointer;background:#0006;color:var(--fg);border:1px solid #fff6;padding:12px 26px;font-size:15px;letter-spacing:.1em;border-radius:0;font-family:inherit}
button:hover,label.btn:hover{background:#fff;color:#000}
button:focus-visible,label.btn:focus-within{outline:2px solid #fff;outline-offset:3px}
#bar{position:fixed;left:0;right:0;bottom:env(safe-area-inset-bottom,0px);display:flex;gap:14px;align-items:center;justify-content:center;padding:14px;font-size:12px;color:var(--dim);opacity:0;transition:opacity .4s}
#bar.show{opacity:1}
#bar button,#bar label.btn{padding:6px 14px;font-size:12px}
#name{max-width:40vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
input[type=file]{position:absolute;opacity:0;width:1px;height:1px}
#rec.on{color:#ff6b6b;border-color:#ff6b6b}
#drop{position:fixed;inset:0;border:2px dashed #fff;display:none;align-items:center;justify-content:center;background:#000a;font-size:18px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div class="t" style="display:flex;flex-direction:column;gap:14px;align-items:center">
    <label class="btn">音源を選ぶ<input type="file" id="file" accept="audio/*,.mp3"></label>
    <p>mp3 / wav / m4a をここにドロップしても読み込めます</p>
  </div>
</div>
<div id="bar" class="show">
  <span id="name"></span>
  <button id="pp" type="button" hidden>一時停止</button>
  <label class="btn" id="lab2" hidden>別の音源<input type="file" id="file2" accept="audio/*,.mp3"></label>
  <button id="rec" type="button" hidden>● 録画</button>
</div>
<div id="drop">ドロップして再生</div>
<script>
(function(){
const MAX = 20;
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl', {antialias:false, alpha:false, preserveDrawingBuffer:true});
if (!gl) { document.body.textContent = 'WebGL が利用できない環境です'; return; }

const VS = `attribute vec2 a; void main(){gl_Position=vec4(a,0.,1.);}`;
const FS = `
precision highp float;
uniform vec2 uRes; uniform vec4 uB[${MAX}];
uniform float uK, uT, uHigh, uBass, uCam;
float smin(float a, float b, float k){ float h = max(k-abs(a-b),0.)/k; return min(a,b) - h*h*k*.25; }
float map(vec3 p){
  float d = 1e5;
  for(int i=0;i<${MAX};i++){ vec4 b = uB[i]; if(b.w > .001) d = smin(d, length(p-b.xyz)-b.w, uK); }
  d += uHigh*.05*sin(p.x*6.+uT*4.)*sin(p.y*6.-uT*3.)*sin(p.z*6.+uT*2.);
  return d;
}
vec3 nrm(vec3 p){ vec2 e = vec2(.004,-.004);
  return normalize(e.xyy*map(p+e.xyy)+e.yyx*map(p+e.yyx)+e.yxy*map(p+e.yxy)+e.xxx*map(p+e.xxx)); }
void main(){
  vec2 uv = (gl_FragCoord.xy - .5*uRes)/uRes.y;
  vec3 ro = vec3(0.,0.,uCam), rd = normalize(vec3(uv,-1.7));
  float t = 0., minD = 1e5, d = 1.;
  for(int i=0;i<80;i++){
    d = map(ro+rd*t); minD = min(minD,d);
    if(d < .002 || t > 30.) break;
    t += d*.85;
  }
  vec3 bg = vec3(.035,.035,.042) + .03*(1.-length(uv)*1.2);
  bg += vec3(.9,.9,.95)*.10*exp(-max(minD,0.)*2.2)*(.6+uBass);
  vec3 col = bg;
  if(d < .01){
    vec3 p = ro+rd*t, n = nrm(p), v = -rd;
    vec3 l = normalize(vec3(-.5,.7,.6)), h = normalize(l+v);
    vec3 base = vec3(.97,.955,.93);
    float wrap = clamp((dot(n,l)+.55)/1.55,0.,1.); wrap *= wrap*(3.-2.*wrap);
    float occ = 0.;
    for(int i=1;i<=4;i++){ float hh = .09*float(i); occ += (hh-map(p+n*hh))*(1./float(i)); }
    float ao = clamp(1.-occ*1.1,0.,1.);
    float thick = clamp(-map(p-n*.4)/.4,0.,1.);
    vec3 sss = vec3(1.,.84,.78)*(pow(clamp(dot(v,-normalize(l+n*.5)),0.,1.),2.)*.22 + (1.-thick)*.13);
    float amb = .22+.18*n.y;
    float spec = pow(max(dot(n,h),0.),22.)*.22 + pow(1.-max(dot(n,v),0.),3.)*.14;
    col = base*(amb*ao + wrap*.82*mix(.6,1.,ao)) + sss*ao + spec*ao;
    col = col/(1.+col*.12);
  }
  col = pow(col, vec3(1./2.2));
  col += (fract(sin(dot(gl_FragCoord.xy,vec2(12.9898,78.233)))*43758.5453)-.5)/255.;
  gl_FragColor = vec4(col,1.);
}`;
function sh(t, s){ const o = gl.createShader(t); gl.shaderSource(o, s); gl.compileShader(o);
  if(!gl.getShaderParameter(o, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(o)); return o; }
const prog = gl.createProgram();
gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS));
gl.linkProgram(prog); gl.useProgram(prog);
const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,3,-1,-1,3]), gl.STATIC_DRAW);
const aLoc = gl.getAttribLocation(prog, 'a'); gl.enableVertexAttribArray(aLoc); gl.vertexAttribPointer(aLoc, 2, gl.FLOAT, false, 0, 0);
const U = n => gl.getUniformLocation(prog, n);
const uRes=U('uRes'), uB=U('uB'), uK=U('uK'), uT=U('uT'), uHigh=U('uHigh'), uBass=U('uBass'), uCam=U('uCam');
function resize(){
  const s = Math.min(devicePixelRatio || 1, 1.5);
  canvas.width = Math.floor(innerWidth*s/2)*2; canvas.height = Math.floor(innerHeight*s/2)*2;
  gl.viewport(0,0,canvas.width,canvas.height);
}
addEventListener('resize', resize); resize();

/* ---- blobs ---- */
const rand = (a,b)=>a+Math.random()*(b-a);
function rdir(){ const v=[rand(-1,1),rand(-1,1),rand(-1,1)*.6], l=Math.hypot(...v)||1; return v.map(x=>x/l); }
let blobs = [];
function nb(p, r){ return {p:p.slice(), v:[0,0,0], r:r, rv:0, tr:r, ab:null, host:false, vol:0}; }
blobs.push(nb([0,0,0], 1.3));
const queue = [];
function runQueue(){
  for (let i=queue.length-1;i>=0;i--){
    const q = queue[i];
    if (T < q.t) continue;
    queue.splice(i,1);
    if (blobs.includes(q.b) && !q.b.ab) split(q.b, q.s, q.d);
  }
}
function split(o, s, d){
  if (blobs.length >= MAX) { absorb(); return; }
  if (o.ab || o.tr < .3) return;
  const dir = rdir(), nr = o.tr*.7937, spd = 1.2 + rand(0,1.2) + s*1.2;
  const c = nb(o.p, o.r*.95); c.tr = nr; o.tr = nr; o.rv -= 1.5;
  for (let i=0;i<3;i++){ c.v[i] = o.v[i] + dir[i]*spd; o.v[i] -= dir[i]*spd*.5; }
  blobs.push(c);
  if (d > 0 && queue.length < 40) {
    queue.push({b:c, t:T+rand(.1,.28), s:s, d:d-1});
    if (Math.random() < .5) queue.push({b:o, t:T+rand(.15,.35), s:s, d:d-1});
  }
}
function absorb(){
  if (blobs.length < 3) return;
  let s = null;
  for (const b of blobs) if (!b.ab && !b.host && (!s || b.tr < s.tr)) s = b;
  if (!s) return;
  let o = null, od = 1e9;
  for (const b of blobs) { if (b === s || b.ab) continue;
    const d = Math.hypot(b.p[0]-s.p[0], b.p[1]-s.p[1], b.p[2]-s.p[2]); if (d < od) { od = d; o = b; } }
  if (!o) return;
  s.ab = o; o.host = true; s.vol = s.tr**3; s.tr = 0;
}
function pickSplit(){
  let best = null;
  for (let i=0;i<3;i++){ const b = blobs[(Math.random()*blobs.length)|0]; if (!best || b.tr > best.tr) best = b; }
  return best;
}
function trigger(s){
  if (blobs.length > 3 && Math.random() < .08) { absorb(); return; }
  const depth = Math.round(s*4), n = s > .7 ? 2 : 1;
  for (let i=0;i<n;i++) split(pickSplit(), s, depth);
}
function step(dt){
  for (let i=0;i<blobs.length;i++){
    const a = blobs[i];
    if (!a.ab) {
      for (let j=i+1;j<blobs.length;j++){
        const b = blobs[j]; if (b.ab) continue;
        const dx=b.p[0]-a.p[0], dy=b.p[1]-a.p[1], dz=b.p[2]-a.p[2], d=Math.hypot(dx,dy,dz)||.001;
        const ov = (a.r+b.r)*.8 - d;
        if (ov > 0) { const f = ov*3*dt/d;
          a.v[0]-=dx*f; a.v[1]-=dy*f; a.v[2]-=dz*f; b.v[0]+=dx*f; b.v[1]+=dy*f; b.v[2]+=dz*f; }
      }
      a.v[0] += (-a.p[0]*.6 + rand(-1,1)*.6)*dt;
      a.v[1] += (-a.p[1]*.6 + rand(-1,1)*.6)*dt;
      a.v[2] += (-a.p[2]*1.6)*dt;
      const dr = Math.exp(-1.2*dt);
      for (let k=0;k<3;k++){ a.v[k]*=dr; a.p[k]+=a.v[k]*dt; }
    } else {
      const k = Math.min(1, 4*dt);
      for (let q=0;q<3;q++) a.p[q] += (a.ab.p[q]-a.p[q])*k;
    }
    a.rv += (a.tr - a.r)*60*dt; a.rv *= Math.exp(-6*dt); a.r += a.rv*dt;
  }
  for (let i=blobs.length-1;i>=0;i--){
    const s = blobs[i];
    if (s.ab && s.r < .08) {
      const o = s.ab; o.tr = Math.min(1.6, Math.cbrt(o.tr**3 + s.vol)); o.rv += .8; o.host = false;
      blobs.splice(i,1);
    }
  }
}

/* ---- audio ---- */
let ctx, analyser, fd, src, dest, buffer, playing = false;
const ui = document.getElementById('ui'), bar = document.getElementById('bar');
const nameEl = document.getElementById('name'), pp = document.getElementById('pp');
function startSource(loop, onend){
  if (src) { src.onended = null; try{src.stop();}catch(e){} src.disconnect(); }
  src = ctx.createBufferSource(); src.buffer = buffer; src.loop = loop;
  src.connect(analyser); src.onended = onend || null; src.start();
}
async function load(file){
  if (!file) return;
  try {
    if (!ctx) {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      analyser = ctx.createAnalyser(); analyser.fftSize = 2048; analyser.smoothingTimeConstant = .6;
      analyser.connect(ctx.destination); dest = ctx.createMediaStreamDestination(); analyser.connect(dest); fd = new Uint8Array(analyser.frequencyBinCount);
    }
    nameEl.textContent = '読み込み中…'; bar.classList.add('show');
    const ab = await file.arrayBuffer();
    buffer = await new Promise((res, rej)=>ctx.decodeAudioData(ab, res, rej));
    startSource(true);
    pp.hidden = false; document.getElementById('lab2').hidden = false;
    await ctx.resume();
    playing = true; pp.textContent = '一時停止';
    nameEl.textContent = file.name; ui.classList.add('hide');
    if (ctx.state !== 'running') nameEl.textContent = '画面をクリックで再生開始';
  } catch (e) {
    nameEl.textContent = '読み込めませんでした。別の音声ファイルを選んでください';
    ui.classList.remove('hide');
  }
}
for (const id of ['file','file2']) document.getElementById(id).addEventListener('change', e=>load(e.target.files[0]));
pp.addEventListener('click', async ()=>{
  if (!ctx) return;
  if (ctx.state === 'running') { await ctx.suspend(); pp.textContent = '再生'; }
  else { await ctx.resume(); pp.textContent = '一時停止'; }
});
canvas.addEventListener('click', ()=>{ if (ctx && ctx.state === 'suspended' && pp.textContent !== '再生') ctx.resume(); });
const dropEl = document.getElementById('drop');
addEventListener('dragover', e=>{ e.preventDefault(); dropEl.style.display = 'flex'; });
addEventListener('dragleave', e=>{ if (e.relatedTarget === null) dropEl.style.display = 'none'; });
addEventListener('drop', e=>{ e.preventDefault(); dropEl.style.display = 'none'; load(e.dataTransfer.files[0]); });
addEventListener('dblclick', ()=>{ document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); });
/* ---- recording ---- */
const recBtn = document.getElementById('rec');
let dl = null, rec = null, chunks = [], recT0 = 0, recTimer = 0, recEnded = false;
(async()=>{
  try { if (window.claude && claude.use) dl = await claude.use('downloads'); } catch(e) {}
  if (dl && window.MediaRecorder) recBtn.hidden = false;
})();
function pickMime(){
  const c = ['video/mp4;codecs=avc1,mp4a.40.2','video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'];
  return c.find(t=>MediaRecorder.isTypeSupported(t)) || '';
}
function startRec(){
  const stream = canvas.captureStream(60);
  if (dest) dest.stream.getAudioTracks().forEach(t=>stream.addTrack(t));
  const mime = pickMime();
  try { rec = new MediaRecorder(stream, {mimeType: mime || undefined, videoBitsPerSecond: 12e6, audioBitsPerSecond: 192e3}); }
  catch(e) { nameEl.textContent = 'この環境では録画できません'; rec = null; return; }
  chunks = []; recEnded = false;
  rec.ondataavailable = e=>{ if (e.data.size) chunks.push(e.data); };
  rec.onstop = finishRec;
  if (ctx) ctx.resume();
  if (buffer && ctx) startSource(false, ()=>{ recEnded = true; stopRec(); });
  rec.start(1000);
  recT0 = performance.now(); recBtn.classList.add('on');
  recTimer = setInterval(()=>{
    const t = Math.floor((performance.now()-recT0)/1000);
    recBtn.textContent = '■ 停止 ' + Math.floor(t/60) + ':' + String(t%60).padStart(2,'0');
  }, 250);
  recBtn.textContent = '■ 停止 0:00';
  nameEl.textContent = buffer ? '曲の頭から録画中(曲が終わると自動で停止)' : '録画中';
}
function stopRec(){
  if (rec && rec.state !== 'inactive') rec.stop();
  clearInterval(recTimer); recBtn.classList.remove('on'); recBtn.textContent = '● 録画';
}
async function finishRec(){
  if (buffer && ctx) { if (recEnded) startSource(true); else if (src) src.loop = true; }
  const type = (rec && rec.mimeType) || 'video/webm';
  const blob = new Blob(chunks, {type});
  chunks = []; rec = null;
  const ext = type.includes('mp4') ? 'mp4' : 'webm';
  const d = new Date(), z = n=>String(n).padStart(2,'0');
  const filename = 'shiratama-' + d.getFullYear() + z(d.getMonth()+1) + z(d.getDate()) + '-' + z(d.getHours()) + z(d.getMinutes()) + z(d.getSeconds()) + '.' + ext;
  try { await dl.save({filename, data: blob}); nameEl.textContent = '保存しました'; }
  catch(e) { nameEl.textContent = e && e.code === 'declined' ? '保存をキャンセルしました' : '保存できませんでした'; }
}
recBtn.addEventListener('click', ()=>{ rec && rec.state === 'recording' ? stopRec() : startRec(); });
addEventListener('keydown', e=>{ if ((e.key === 'r' || e.key === 'R') && !recBtn.hidden) recBtn.click(); });

function band(f0, f1){
  const bw = ctx.sampleRate / analyser.fftSize;
  const a = Math.max(1, Math.floor(f0/bw)), b = Math.max(a+1, Math.floor(f1/bw));
  let s = 0; for (let i=a;i<b;i++) s += fd[i];
  return s/(b-a)/255;
}

/* ---- loop ---- */
const S = {bass:0, high:0, lvl:0}, avg = {bass:.1}, pk = {bass:.06, high:.06, lvl:.06};
let acc = 0;
let T = 0, last = performance.now(), lastBeat = 0, idle = 1.2, quiet = 0;
const arr = new Float32Array(MAX*4);
function frame(now){
  requestAnimationFrame(frame);
  const dt = Math.min((now-last)/1000, .05); last = now; T += dt;
  const live = playing && ctx && ctx.state === 'running';
  let bass, high;
  let lvl;
  if (live) { analyser.getByteFrequencyData(fd); bass = band(30,150); high = band(2500,9000); lvl = band(30,5000); }
  else { bass = .1 + .05*Math.sin(T*1.6); high = .04; lvl = .1; }
  const g = (v,k)=>{ pk[k] = Math.max(v, .06, pk[k]*Math.exp(-dt*.05)); return Math.min(1, v/pk[k]); };
  if (live) { bass = g(bass,'bass'); high = g(high,'high'); lvl = g(lvl,'lvl'); }
  S.bass += (bass-S.bass)*(bass>S.bass?.7:.15);
  S.high += (high-S.high)*(high>S.high?.6:.15);
  S.lvl += (lvl-S.lvl)*(lvl>S.lvl?.4:.08);
  if (live) {
    quiet += dt;
    if (S.bass > avg.bass*1.15 + .02 && T-lastBeat > .12) { lastBeat = T; quiet = 0; trigger(S.lvl); }
    acc += dt*S.lvl*S.lvl*7;
    if (acc > 1) { acc = 0; trigger(S.lvl); }
    if (quiet > 1.5) { quiet = 0; trigger(.3); }
    avg.bass += (S.bass-avg.bass)*.06;
  } else {
    idle -= dt;
    if (idle < 0) { trigger(.5); idle = rand(1.0,2.4); }
  }
  runQueue(); step(dt);
  const a = T*.08, ca = Math.cos(a), sa = Math.sin(a);
  arr.fill(0);
  blobs.forEach((b,i)=>{
    arr[i*4]   = b.p[0]*ca + b.p[2]*sa;
    arr[i*4+1] = b.p[1];
    arr[i*4+2] = -b.p[0]*sa + b.p[2]*ca;
    arr[i*4+3] = Math.max(0, b.r)*(1 + S.bass*.14);
  });
  gl.uniform4fv(uB, arr);
  gl.uniform2f(uRes, canvas.width, canvas.height);
  gl.uniform1f(uK, .55 + S.bass*.35);
  gl.uniform1f(uT, T);
  gl.uniform1f(uHigh, Math.min(1, S.high*1.5));
  gl.uniform1f(uBass, S.bass);
  gl.uniform1f(uCam, innerWidth/innerHeight < 1 ? 16 : 9);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
